{% extends 'base.html' %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Cursos</h2>
    <a href="{{ url_for('nuevo_curso') }}" class="btn btn-primary">+ Agregar Curso</a>
</div>

<table class="table table-bordered bg-white shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre del Curso</th>
            <th>Docente</th>
            <th>Duración</th>
        </tr>
    </thead>
    <tbody>
        {% for c in cursos %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.docente }}</td>
            <td>{{ c.duracion }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center">No hay cursos registrados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
